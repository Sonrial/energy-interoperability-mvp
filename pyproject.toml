[project]
name = "energy-interoperability-mvp"
version = "0.1.0"
description = "MVP for renewable energy data interoperability"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0",
  "fastapi>=0.111",
  "httpx>=0.27",
  "pandas>=2.2",
  "pandera>=0.20",
  "polars>=1.0",
  "pyarrow>=16.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "structlog>=24.1",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
energy = ["pvlib>=0.10", "rdtools>=3.0", "openoa>=3.1"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
